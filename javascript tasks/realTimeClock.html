<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="author" content="Mohammed Sadat Ishraq Labib">
    <meta name="description" content="Real-Time Clock">
    <title>Digital Clock</title>

    <style>

        #clock {
            width: 250px;
            margin: 100px auto;
            padding: 20px;
            border: 2px solid rgb(123, 19, 19);
            text-align: center;
            font-size: 30px;
            background-color: rgb(75, 140, 45);
        }

    </style>

</head>

<body>

    <div id="clock"></div>

    <script>

        function showTime() {

            let now = new Date();

            let hours = now.getHours();
            let minutes = now.getMinutes();
            let seconds = now.getSeconds();

            let period = "AM";

            if (hours >= 12) {
                period = "PM";
            }

            if (hours > 12) {
                hours = hours - 12;
            }

            if (hours == 0) {
                hours = 12;
            }

            if (hours < 10) {
                hours = "0" + hours;
            }

            if (minutes < 10) {
                minutes = "0" + minutes;
            }

            if (seconds < 10) {
                seconds = "0" + seconds;
            }

            document.getElementById("clock").innerText =
                hours + ":" + minutes + ":" + seconds + " " + period;

        }

        showTime();

        setInterval(showTime, 1000);

    </script>

</body>

</html>
