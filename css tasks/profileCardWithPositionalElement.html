<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="author" content="Mohammed Sadat Ishraq Labib">
    <meta name="description" content="Profile Card with Positioned Elements">
    <title>User Profile Card</title>

    <style>

        .card {
            position: relative;
            width: 300px;
            margin: 30px auto;
            padding: 20px;
            border: 2px solid black;
            border-radius: 10px;
            background-color: lightgray;
        }

        .badge {
            position: absolute;
            top: 10px;
            right: 10px;
            padding: 5px 10px;
            border: 1px solid black;
            background-color: lightgreen;
            border-radius: 5px;
        }

        .card img {
            border-radius: 10px;
        }

    </style>

</head>

<body>

    <div class="card">

        <div class="badge">Online</div>

        <img src="/html tasks/images/myPic2.jpeg" alt="Profile Photo" width="120">

        <h2>Mohammed Sadat Ishraq Labib</h2>

        <p>
            Computer Science and Engineering student at
            American International University-Bangladesh (AIUB).
        </p>

    </div>

</body>

</html>
